{% extends "base.html" %}
{% block title %}Heart Disease Prediction{% endblock %}
{% block content %}
<a href="/" class="back-btn mb-3">
    <i class="fas fa-arrow-left"></i> Back
</a>
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-body p-0">
                <div style="background:linear-gradient(135deg,#7f1d1d,#dc2626);
                     border-radius:16px 16px 0 0;padding:24px 28px;color:white;">
                    <div class="d-flex align-items-center gap-3">
                        <div style="background:rgba(255,255,255,0.2);
                             border-radius:12px;padding:12px;">
                            <i class="fas fa-heart fa-lg"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-0">Heart Disease Prediction</h4>
                            <small class="opacity-75">
                                Fill in your basic health details below
                            </small>
                        </div>
                    </div>
                </div>
                <div class="p-4">
                    <form action="/predict/heart" method="POST"
                          onsubmit="showLoader()">

                        <!-- Hidden fields with defaults -->
                        <input type="hidden" name="height" value="165">
                        <input type="hidden" name="weight" value="70">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Age (years)</label>
                                <input type="number" name="age"
                                       class="form-control"
                                       placeholder="e.g. 45"
                                       min="1" max="100" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Gender</label>
                                <select name="gender"
                                        class="form-select" required>
                                    <option value="">Select Gender</option>
                                    <option value="1">Female</option>
                                    <option value="2">Male</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Systolic Blood Pressure
                                    <small class="text-muted">(upper number)</small>
                                </label>
                                <input type="number" name="ap_hi"
                                       class="form-control"
                                       placeholder="Normal: 120"
                                       min="60" max="250" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Diastolic Blood Pressure
                                    <small class="text-muted">(lower number)</small>
                                </label>
                                <input type="number" name="ap_lo"
                                       class="form-control"
                                       placeholder="Normal: 80"
                                       min="40" max="200" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Cholesterol Level</label>
                                <select name="cholesterol"
                                        class="form-select" required>
                                    <option value="">Select</option>
                                    <option value="1">Normal</option>
                                    <option value="2">Above Normal</option>
                                    <option value="3">
                                        Well Above Normal
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Glucose Level</label>
                                <select name="gluc"
                                        class="form-select" required>
                                    <option value="">Select</option>
                                    <option value="1">Normal</option>
                                    <option value="2">Above Normal</option>
                                    <option value="3">
                                        Well Above Normal
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Do you Smoke?</label>
                                <select name="smoke"
                                        class="form-select" required>
                                    <option value="">Select</option>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">
                                    Do you Drink Alcohol?
                                </label>
                                <select name="alco"
                                        class="form-select" required>
                                    <option value="">Select</option>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">
                                    Physically Active?
                                </label>
                                <select name="active"
                                        class="form-select" required>
                                    <option value="">Select</option>
                                    <option value="1">Yes</option>
                                    <option value="0">No</option>
                                </select>
                            </div>
                        </div>

                        <div class="alert alert-info py-2 mt-2"
                             style="font-size:0.85rem;border-radius:10px;">
                            <i class="fas fa-info-circle me-2"></i>
                            This prediction uses your blood pressure,
                            cholesterol, glucose and lifestyle data.
                        </div>

                        <div class="text-center mt-3">
                            <button type="submit"
                                    class="btn btn-danger btn-lg px-5">
                                <i class="fas fa-search me-2"></i>
                                Predict Now
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
